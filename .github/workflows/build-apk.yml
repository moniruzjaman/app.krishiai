name: 🌾 Build Krishi AI APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'worker/**'
      - 'ml/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Local Build — Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔐 Verify Expo login
        run: eas whoami

      - name: 🏗️ EAS Local Build (no cloud quota used)
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-apk-release}"
          echo "Building profile: $PROFILE (local)"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output ./build/krishi-ai.apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: krishi-ai-apk
          path: ./build/krishi-ai.apk
          retention-days: 30

      - name: ✅ Done
        run: |
          echo "========================================"
          echo "✅ APK built locally — no EAS quota used!"
          echo "Download from Actions → Artifacts"
          echo "========================================"
