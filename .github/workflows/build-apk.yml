name: 🌾 Build Krishi AI APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - preview
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Build — Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Verify Expo login
        run: eas whoami

      - name: 🔑 Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: 🏗️ Trigger EAS Build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-apk-release}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait \
            --freeze-credentials

      - name: ✅ Done
        run: |
          echo "======================================"
          echo "✅ Build submitted to EAS cloud!"
          echo "Monitor: https://expo.dev/accounts/moniruzjaman/projects/krishi-ai/builds"
          echo "======================================"
