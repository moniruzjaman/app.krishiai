name: 🌾 Build Krishi AI APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Build — Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --include=dev

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Verify Expo login
        run: eas whoami

      - name: 🔑 Write API keys to .env file
        run: |
          # EXPO_PUBLIC_ vars are baked into the JS bundle at build time
          # EAS reads .env automatically - this is the correct approach
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_OPENROUTER_API_KEY=${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}" >> .env
          echo "NODE_ENV=production" >> .env
          
          # Verify keys are present (show only first 10 chars for security)
          GEMINI_KEY="${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}"
          OPENROUTER_KEY="${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}"
          
          if [ -n "$GEMINI_KEY" ]; then
            echo "✅ Gemini key: ${GEMINI_KEY:0:10}..."
          else
            echo "❌ WARNING: EXPO_PUBLIC_GEMINI_API_KEY is empty!"
          fi
          
          if [ -n "$OPENROUTER_KEY" ]; then
            echo "✅ OpenRouter key: ${OPENROUTER_KEY:0:10}..."
          else
            echo "⚠️  OpenRouter key not set (optional)"
          fi

      - name: 🔑 Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: 🏗️ Trigger EAS Build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-apk-release}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait

      - name: ✅ Done
        run: |
          echo "======================================"
          echo "✅ Build submitted to EAS cloud!"
          echo "Monitor: https://expo.dev/accounts/moniruzjaman/projects/krishi-ai/builds"
          echo "======================================"
