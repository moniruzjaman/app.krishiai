name: 🌾 Build Krishi AI APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - preview
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Build — Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔐 Verify Expo login
        run: eas whoami

      - name: 🔍 Get Project ID
        run: |
          echo "Fetching project info..."
          PROJECT_ID=$(curl -s \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            "https://api.expo.dev/v2/projects?slug=krishi-ai&ownerAccount=moniruzjaman" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data'][0]['id'])" 2>/dev/null || echo "not-found")
          echo "Project ID: $PROJECT_ID"
          if [ "$PROJECT_ID" != "not-found" ] && [ -n "$PROJECT_ID" ]; then
            # Update app.json with correct projectId
            python3 -c "
import json
with open('app.json') as f:
    data = json.load(f)
data['expo']['extra'] = {'eas': {'projectId': '$PROJECT_ID'}}
with open('app.json', 'w') as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
print('Updated app.json with projectId: $PROJECT_ID')
"
          fi

      - name: 🔑 Write Google Service Account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      - name: 🏗️ Trigger EAS Build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-apk-release}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait

      - name: ✅ Done
        run: |
          echo "======================================"
          echo "✅ Build submitted to EAS cloud!"
          echo "Monitor: https://expo.dev/accounts/moniruzjaman/projects/krishi-ai/builds"
          echo "======================================"
