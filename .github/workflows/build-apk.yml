name: 🌾 Build Krishi AI APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'worker/**'
      - 'ml/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: false
        default: 'apk-release'
        type: choice
        options:
          - apk-release
          - production

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    name: EAS Build — Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔐 Verify Expo login
        run: eas whoami

      - name: 🏗️ Trigger EAS Build
        run: |
          PROFILE="${{ github.event.inputs.profile }}"
          PROFILE="${PROFILE:-apk-release}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait

      - name: ✅ Done
        run: |
          echo "========================================"
          echo "✅ Build submitted to EAS cloud!"
          echo "No API keys in APK — all calls via Cloudflare Worker"
          echo "Monitor: https://expo.dev/accounts/moniruzjaman/projects/krishi-ai/builds"
          echo "========================================"
